name: Daily Competitor Intel Pipeline

on:
  schedule:
    # 00:00 UTC is 07:00 AM in Phnom Penh
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to click "Run workflow" manually in GitHub

permissions:
  contents: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas playwright requests
          playwright install chromium
          
      - name: Run Facebook Organic Scraper
        run: python organic_scraper.py
        
      - name: Run Meta Ads Library Scraper
        run: python scraper.py
        
      - name: Generate HTML Dashboard
        run: python export_html.py
        
      - name: Commit and Push Updated Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add ads_data.csv organic_data.csv index.html *.html
          git commit -m "Auto-update: B2B/Retail competitor intel" || echo "No changes to commit"
          git push
